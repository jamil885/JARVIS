services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_DB_PASSWORD:?Define JARVIS_DB_PASSWORD en .env}
      POSTGRES_DB: jarvis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jarvis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  jarvis_postgres:
